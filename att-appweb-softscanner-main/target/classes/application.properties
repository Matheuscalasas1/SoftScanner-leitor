# Nome da aplicação
spring.application.name=soft

# Configurações do MySQL - MODIFICADO
spring.datasource.url=jdbc:mysql://localhost:3306/softscanner_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456

# Configurações do JPA/Hibernate - MODIFICADO
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

# Configurações do Thymeleaf
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.servlet.content-type=text/html
spring.thymeleaf.cache=false

# Configurações do servidor
server.port=8080

# Permite inicialização mesmo sem banco - MODIFICADO
spring.autoconfigure.exclude=